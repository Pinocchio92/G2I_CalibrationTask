<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Attack</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main>
    <header><div><p class="eyebrow">CANVAS 2D / ALIEN WAVES</p><h1>SPACE ATTACK</h1></div><span id="status" role="status">Ready</span></header>
    <div class="hud"><span>SCORE <strong id="score">0</strong></span><span>WAVE <strong id="wave">1</strong></span><span>LIVES <strong id="lives">3</strong></span></div>
    <div class="play-area">
    <canvas id="game" width="960" height="600" aria-label="Space Attack play area. Use A and D or arrow keys to move, and hold Space to fire."></canvas>
    <div id="announcement" role="status" aria-live="polite"></div>
    </div>
    <p class="instructions">Move: A/D or ←/→ | Fire: Hold Space</p>
    <nav aria-label="Game controls">
      <button id="start" type="button">Start game</button>
      <button id="pause" type="button" disabled>Pause</button>
      <button id="restart" type="button">Restart</button>
    </nav>
  </main>
</body>
</html>
